<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      :root {
        --surface: #0f172a;
        --accent1: #00d2ff;
        --accent2: #8b5cf6;
        --shadow: #0b1120;
      }
      .bg { fill: var(--surface); }
      .outline { fill: none; stroke: var(--accent1); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .secondary { fill: none; stroke: var(--accent2); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: var(--accent1); }
      .highlight { fill: var(--accent2); }
    </style>
  </defs>

  <rect width="320" height="120" rx="24" class="bg" opacity="0" />

  <g transform="translate(24 16)">
    <path class="outline" d="M28 40 C28 22 44 14 60 14 h22 c16 0 28 12 28 28 s-12 28-28 28 H72" />
    <path class="outline" d="M88 42 H112 a20 20 0 0 1 0 40 H94" />
    <path class="secondary" d="M54 40 H92" />
    <circle class="node" cx="70" cy="40" r="6" />
    <circle class="node" cx="90" cy="40" r="6" />
    <path class="secondary" d="M116 14 l16 16 -16 16" />
    <path class="secondary" d="M116 92 l16 -16 -16 -16" />
    <circle class="highlight" cx="26" cy="44" r="4" />
    <circle class="highlight" cx="26" cy="68" r="4" />
  </g>

  <g transform="translate(178 28)">
    <rect x="0" y="0" width="118" height="64" rx="16" fill="var(--shadow)" />
    <path class="outline" d="M16 34 h26 a12 12 0 0 1 0 24 H24" />
    <circle class="node" cx="82" cy="38" r="6" />
    <path class="secondary" d="M60 20 h26" />
  </g>
</svg>