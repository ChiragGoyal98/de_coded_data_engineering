name: Generate periodic content

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */8 * * *'

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip
      - run: pip install python-dotenv
      - run: python pipeline/content_generator.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/content.json site/articles || true
          git diff --cached --quiet || (git commit -m "chore: update generated site content" && git push)
