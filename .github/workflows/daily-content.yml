name: Generate periodic content

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */8 * * *'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_API_URL: ${{ secrets.GOOGLE_API_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$GOOGLE_API_KEY"
          test -n "$GOOGLE_API_URL"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_GROUP_ID"
          test -n "$SITE_BASE_URL"
      - run: python pipeline/content_generator.py
      - run: python bot/send_test_message.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/content.json apps/web/public/articles || true
          git diff --cached --quiet || (git commit -m "chore: update generated site content" && git push)
